name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "NovelScriptEngine-Source-Optimized.zip"
      - "NovelScriptEngine-v1.9.patch"
      - "NovelScriptEngine-v1.10-app.patch"
      - "NovelScriptEngine-v1.10-test-and-samples.patch"
      - "NovelScriptEngine-v1.10-docs.patch"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python on the hosted Windows runner
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Restore source package
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "NovelScriptEngine-Source-Optimized.zip"
          if (!(Test-Path $archive)) {
            throw "NovelScriptEngine-Source-Optimized.zip がリポジトリ直下にありません。ZIPをアップロードしてください。"
          }
          $source = Join-Path $env:RUNNER_TEMP "NovelScriptEngine-source"
          Expand-Archive -LiteralPath $archive -DestinationPath $source -Force
          if (!(Test-Path (Join-Path $source "app.py"))) {
            throw "ZIP内に app.py が見つかりません。配布したソースZIPを確認してください。"
          }
          "SOURCE_DIR=$source" >> $env:GITHUB_ENV

      # Only the runtime and GUI smoke-test portions of the v1.9 delta are applied here.
      - name: Apply versioned source changes
        shell: pwsh
        run: |
          $patch = Join-Path $env:GITHUB_WORKSPACE "NovelScriptEngine-v1.9.patch"
          if (!(Test-Path $patch)) {
            throw "NovelScriptEngine-v1.9.patch がありません。"
          }
          Push-Location $env:SOURCE_DIR
          try {
            git apply --include=app.py --include=tests/gui_smoke.py --ignore-whitespace --ignore-space-change --recount $patch
          } finally {
            Pop-Location
          }

      - name: Normalize source line endings for patch application
        shell: pwsh
        run: |
          $normalize = @'
          from pathlib import Path
          names = [
              "app.py", "tests/test_desktop.py", "tests/gui_smoke.py",
              "README.md", "CHANGELOG.md", "BUILD_NOTES.md", "TEST_REPORT.md",
              "examples/sample_5min.nse",
          ]
          for name in names:
              path = Path(name)
              if path.exists():
                  data = path.read_bytes().replace(bytes((13, 10)), bytes((10,))).replace(bytes((13,)), bytes((10,)))
                  path.write_bytes(data)
          '@
          Push-Location $env:SOURCE_DIR
          try {
            $normalize | python -
          } finally {
            Pop-Location
          }

      - name: Apply v1.10 visual effect changes
        shell: pwsh
        run: |
          $patches = @(
            "NovelScriptEngine-v1.10-app.patch",
            "NovelScriptEngine-v1.10-test-and-samples.patch",
            "NovelScriptEngine-v1.10-docs.patch"
          )
          Push-Location $env:SOURCE_DIR
          try {
            foreach ($name in $patches) {
              $patch = Join-Path $env:GITHUB_WORKSPACE $name
              if (!(Test-Path $patch)) { throw "Patch file not found: $name" }
              git apply --ignore-whitespace --ignore-space-change --recount $patch
              if ($LASTEXITCODE -ne 0) { throw "Failed to apply $name" }
            }
          } finally {
            Pop-Location
          }

      - name: Update v1.10 application label
        shell: pwsh
        run: |
          $update = @'
          from pathlib import Path
          path = Path("app.py")
          source = path.read_text(encoding="utf-8")
          old = "v1.9 Desktop  |  Windowsネイティブ版・オフライン"
          new = "v1.10 Desktop  |  Windowsネイティブ版・オフライン"
          if source.count(old) != 1:
              raise SystemExit("Expected v1.9 application label exactly once")
          path.write_bytes(source.replace(old, new).encode("utf-8"))
          '@
          Push-Location $env:SOURCE_DIR
          try {
            $update | python -
          } finally {
            Pop-Location
          }

      - name: Install build dependency
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:SOURCE_DIR/requirements-build.txt"

      - name: Run regression tests
        shell: pwsh
        run: |
          python -m py_compile "$env:SOURCE_DIR/app.py"
          Push-Location $env:SOURCE_DIR
          try {
            python -m unittest discover -s tests -p "test_*.py" -v
          } finally {
            Pop-Location
          }

      - name: Run native GUI smoke test
        shell: pwsh
        run: |
          Push-Location $env:SOURCE_DIR
          try {
            python tests/gui_smoke.py
          } finally {
            Pop-Location
          }

      - name: Compile standalone Windows application
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $work = Join-Path $env:RUNNER_TEMP "nse-pyinstaller-work"
          $spec = Join-Path $env:RUNNER_TEMP "nse-pyinstaller-spec"
          $pyArgs = @(
            "-m", "PyInstaller", "--noconfirm", "--clean", "--windowed", "--onefile",
            "--name", "NovelScriptEngine",
            "--distpath", $dist, "--workpath", $work, "--specpath", $spec,
            "--add-data", "$env:SOURCE_DIR/assets;assets",
            "--add-data", "$env:SOURCE_DIR/assets_png;assets_png",
            "--add-data", "$env:SOURCE_DIR/examples;examples",
            "$env:SOURCE_DIR/app.py"
          )
          python @pyArgs
          if (!(Test-Path (Join-Path $dist "NovelScriptEngine.exe"))) {
            throw "EXEが生成されませんでした。"
          }
          Copy-Item "$env:SOURCE_DIR/README.md" "$dist/README_日本語.md"
          Copy-Item "$env:SOURCE_DIR/ASSET_CREDITS.md" "$dist/ASSET_CREDITS.md"
          Compress-Archive -Path "$env:SOURCE_DIR/*" -DestinationPath (Join-Path $dist "NovelScriptEngine-v1.10-Source.zip") -Force

      - name: Publish downloadable Windows package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: NovelScriptEngine-Windows-x64-v1.10
          path: dist/
          if-no-files-found: error
          retention-days: 30
