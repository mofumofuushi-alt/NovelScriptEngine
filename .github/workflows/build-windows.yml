name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "NovelScriptEngine-Source-Optimized.zip"
      - "NovelScriptEngine-v1.9.patch"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python on the hosted Windows runner
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Restore source package
        shell: pwsh
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "NovelScriptEngine-Source-Optimized.zip"
          if (!(Test-Path $archive)) {
            throw "NovelScriptEngine-Source-Optimized.zip がリポジトリ直下にありません。ZIPをアップロードしてください。"
          }
          $source = Join-Path $env:RUNNER_TEMP "NovelScriptEngine-source"
          Expand-Archive -LiteralPath $archive -DestinationPath $source -Force
          if (!(Test-Path (Join-Path $source "app.py"))) {
            throw "ZIP内に app.py が見つかりません。配布したソースZIPを確認してください。"
          }
          "SOURCE_DIR=$source" >> $env:GITHUB_ENV

      - name: Apply versioned source changes
        shell: pwsh
        run: |
          $patch = Join-Path $env:GITHUB_WORKSPACE "NovelScriptEngine-v1.9.patch"
          if (!(Test-Path $patch)) {
            throw "NovelScriptEngine-v1.9.patch がありません。"
          }
          Push-Location $env:SOURCE_DIR
          try {
            git apply --ignore-whitespace --ignore-space-change --recount $patch
          } finally {
            Pop-Location
          }

      - name: Install build dependency
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:SOURCE_DIR/requirements-build.txt"

      - name: Run regression tests
        shell: pwsh
        run: |
          python -m py_compile "$env:SOURCE_DIR/app.py"
          Push-Location $env:SOURCE_DIR
          try {
            python -m unittest discover -s tests -p "test_*.py" -v
          } finally {
            Pop-Location
          }

      - name: Run native GUI smoke test
        shell: pwsh
        run: |
          Push-Location $env:SOURCE_DIR
          try {
            python tests/gui_smoke.py
          } finally {
            Pop-Location
          }

      - name: Compile standalone Windows application
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $work = Join-Path $env:RUNNER_TEMP "nse-pyinstaller-work"
          $spec = Join-Path $env:RUNNER_TEMP "nse-pyinstaller-spec"
          $pyArgs = @(
            "-m", "PyInstaller", "--noconfirm", "--clean", "--windowed", "--onefile",
            "--name", "NovelScriptEngine",
            "--distpath", $dist, "--workpath", $work, "--specpath", $spec,
            "--add-data", "$env:SOURCE_DIR/assets;assets",
            "--add-data", "$env:SOURCE_DIR/assets_png;assets_png",
            "--add-data", "$env:SOURCE_DIR/examples;examples",
            "$env:SOURCE_DIR/app.py"
          )
          python @pyArgs
          if (!(Test-Path (Join-Path $dist "NovelScriptEngine.exe"))) {
            throw "EXEが生成されませんでした。"
          }
          Copy-Item "$env:SOURCE_DIR/README.md" "$dist/README_日本語.md"
          Copy-Item "$env:SOURCE_DIR/ASSET_CREDITS.md" "$dist/ASSET_CREDITS.md"
          Compress-Archive -Path "$env:SOURCE_DIR/*" -DestinationPath (Join-Path $dist "NovelScriptEngine-v1.9-Source.zip") -Force

      - name: Publish downloadable Windows package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: NovelScriptEngine-Windows-x64-v1.9
          path: dist/
          if-no-files-found: error
          retention-days: 30
